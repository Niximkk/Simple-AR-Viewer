<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #080808;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #080808;
            --poster-color: transparent;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e8e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            z-index: 10;
            display: none;
        }

        .spinner {
            border: 3px solid rgba(139, 26, 26, 0.25);
            border-top: 3px solid #c92a2a;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
            box-shadow: 0 0 16px rgba(201, 42, 42, 0.35);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #ar-button {
            background: #0a0a0a;
            border: 1.5px solid #8b1a1a;
            border-radius: 4px;
            padding: 13px 26px;
            position: fixed;
            top: 24px;
            right: 24px;
            color: #e8e0e0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(139, 26, 26, 0.35), inset 0 0 12px rgba(139, 26, 26, 0.08);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: all 0.25s ease;
        }

        #ar-button:hover {
            border-color: #c92a2a;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 8px 28px rgba(201, 42, 42, 0.5), inset 0 0 16px rgba(201, 42, 42, 0.15);
            color: #ffffff;
        }

        #ar-button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading model...</div>
    </div>

    <model-viewer
        id="viewer"
        camera-controls
        touch-action="none"
        ar
        ar-modes="scene-viewer quick-look"
        shadow-intensity="1"
        auto-rotate
        rotation-per-second="30deg"
        interaction-prompt="none"
        ar-scale="auto">

        <button slot="ar-button" id="ar-button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            AR
        </button>
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const loading = document.getElementById('loading');

        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('url');

        if (modelUrl) {
            loading.style.display = 'block';
            viewer.src = modelUrl;

            viewer.addEventListener('load', () => {
                loading.style.display = 'none';
            });

            viewer.addEventListener('error', () => {
                loading.innerHTML = '<div>Error loading model</div>';
            });
        } else {
            loading.style.display = 'block';
            loading.innerHTML = '<div>Add ?url=YOUR_MODEL.glb to the URL</div>';
        }

        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
